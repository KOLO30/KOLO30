name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: KOLO30
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00E5FF

      - name: Crop outer margin so snake stays inside grid
        run: |
          python3 -c '
          import glob, re

          for path in glob.glob("dist/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  svg = f.read()

              def crop_viewbox(match):
                  x, y, w, h = map(float, match.group(1).split())
                  return f"viewBox=\"{x + 16:g} {y + 16:g} {w - 32:g} {h - 16:g}\""

              svg = re.sub(r"viewBox=\"([^\"]+)\"", crop_viewbox, svg, count=1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(svg)
          '

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
